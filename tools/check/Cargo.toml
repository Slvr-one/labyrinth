[package]
name = "labyrinth-check"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Verification gate for the Labyrinth Rust-to-Lean model"
publish = false

# Standalone package: it must never become a member of the labyrinth-core crate's workspace.
[workspace]

[dependencies]
# toolchain-pins.json is the single source of truth for the pinned revisions.
serde_json = "1"
